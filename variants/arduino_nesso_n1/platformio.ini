[Nesso_N1]
extends = esp32c6_base
board = arduino_nesso_n1
board_build.partitions = default_16MB.csv
build_flags =
  ${esp32c6_base.build_flags}
  -I variants/arduino_nesso_n1
  -D LORA_FREQ=910.525
  -D LORA_BW=62.5
  -D LORA_SF=7
  -D LORA_CR=5
  -D ARDUINO_USB_CDC_ON_BOOT=1
  -D ARDUINO_USB_MODE=1
  -UENABLE_PRIVATE_KEY_IMPORT
  -UENABLE_PRIVATE_KEY_EXPORT
  -D ENABLE_PRIVATE_KEY_IMPORT=0
  -D ENABLE_PRIVATE_KEY_EXPORT=0
  -D NESSO_N1_BOARD=1
  -D NESSO_DERIVE_ADMIN_PASSWORD=1
  -D P_LORA_SCLK=20
  -D P_LORA_MISO=22
  -D P_LORA_MOSI=21
  -D P_LORA_NSS=23
  -D P_LORA_DIO_1=15
  -D P_LORA_BUSY=19
  -D P_LORA_RESET=RADIOLIB_NC
  -D P_LCD_CS=17
  -D P_LCD_DC=16
  -D PIN_BOARD_SDA=10
  -D PIN_BOARD_SCL=8
  -D PIN_BUZZER=11
  -D USE_SX1262
  -D RADIO_CLASS=CustomSX1262
  -D WRAPPER_CLASS=CustomSX1262Wrapper
  -D LORA_TX_POWER=22
  -D MAX_LORA_TX_POWER=22
  -D SX126X_DIO2_AS_RF_SWITCH=true
  -D SX126X_DIO3_TCXO_VOLTAGE=3.0
  -D SX126X_USE_REGULATOR_LDO=true
  -D SX126X_CURRENT_LIMIT=140
  -D SX126X_RX_BOOSTED_GAIN=1
  -D DISPLAY_CLASS=NessoMeshDisplay
  -D KEEP_DISPLAY_ON_USB=1
  -D AUTO_OFF_MILLIS=20000
  -D AUTO_SHUTDOWN_MILLIVOLTS=3300
  -D BATT_MIN_MILLIVOLTS=3300
  -D BATT_MAX_MILLIVOLTS=4200
  -D DISABLE_WIFI_OTA=1
build_src_filter = ${esp32c6_base.build_src_filter}
  +<../variants/arduino_nesso_n1/*.cpp>
  +<helpers/ui/LGFXDisplay.cpp>
  +<helpers/ui/buzzer.cpp>
lib_deps =
  ${esp32c6_base.lib_deps}
  lovyan03/LovyanGFX @ ^1.2.7
  end2endzone/NonBlockingRTTTL @ ^1.3.0

[env:Nesso_N1_companion_radio_usb]
extends = Nesso_N1
build_flags =
  ${Nesso_N1.build_flags}
  -I examples/companion_radio/ui-new
  -D PIN_USER_BTN=0
  -D MAX_CONTACTS=350
  -D MAX_GROUP_CHANNELS=40
  -D OFFLINE_QUEUE_SIZE=256
build_src_filter = ${Nesso_N1.build_src_filter}
  +<helpers/esp32/*.cpp>
  -<helpers/esp32/ESPNOWRadio.cpp>
  +<../examples/companion_radio/*.cpp>
  +<../examples/companion_radio/ui-new/*.cpp>
lib_deps =
  ${Nesso_N1.lib_deps}
  densaugeo/base64 @ ~1.4.0

[env:Nesso_N1_companion_radio_ble]
extends = Nesso_N1
build_flags =
  ${Nesso_N1.build_flags}
  -I examples/companion_radio/ui-new
  -D PIN_USER_BTN=0
  -D MAX_CONTACTS=350
  -D MAX_GROUP_CHANNELS=40
  -D BLE_PIN_CODE=123456
  -D OFFLINE_QUEUE_SIZE=256
build_src_filter = ${Nesso_N1.build_src_filter}
  +<helpers/esp32/*.cpp>
  -<helpers/esp32/ESPNOWRadio.cpp>
  +<../examples/companion_radio/*.cpp>
  +<../examples/companion_radio/ui-new/*.cpp>
lib_deps =
  ${Nesso_N1.lib_deps}
  densaugeo/base64 @ ~1.4.0

[env:Nesso_N1_companion_radio_wifi]
extends = Nesso_N1
build_flags =
  ${Nesso_N1.build_flags}
  -I examples/companion_radio/ui-new
  -D PIN_USER_BTN=0
  -D MAX_CONTACTS=350
  -D MAX_GROUP_CHANNELS=40
  -D OFFLINE_QUEUE_SIZE=256
  -D WIFI_AP_MODE=1
  -D WIFI_SSID='"NessoN1-MeshCore"'
  -D WIFI_PWD='"NessoMesh123"'
build_src_filter = ${Nesso_N1.build_src_filter}
  +<helpers/esp32/*.cpp>
  -<helpers/esp32/ESPNOWRadio.cpp>
  +<../examples/companion_radio/*.cpp>
  +<../examples/companion_radio/ui-new/*.cpp>
lib_deps =
  ${Nesso_N1.lib_deps}
  densaugeo/base64 @ ~1.4.0

[env:Nesso_N1_companion_radio_smart]
extends = Nesso_N1
build_flags =
  ${Nesso_N1.build_flags}
  -I examples/companion_radio/ui-new
  -D PIN_USER_BTN=0
  -D MAX_CONTACTS=350
  -D MAX_GROUP_CHANNELS=40
  -D BLE_PIN_CODE=123456
  -D OFFLINE_QUEUE_SIZE=256
  -D NESSO_SMART_COMPANION=1
  -D NESSO_BOOT_DIAG=1
  -D NESSO_CONNECTIVITY_LOGGING=1
  -D BLE_FRAME_QUEUE_SIZE=3
  -D WIFI_FRAME_QUEUE_SIZE=3
  -D BLE_ENABLE_BONDING=0
  -D BLE_REQUIRE_MITM=0
  -D BLE_OPEN_GATT=1
  -D BLE_MTU_SIZE=179
  -D NESSO_WIFI_AUTO_START=0
  -D NESSO_WIFI_START_DELAY_MS=30000
  -D NESSO_WIFI_START_AFTER_BLE_MS=3000
  -D WIFI_AP_MODE=1
  -D WIFI_SSID='"NessoN1-MeshCore"'
  -D WIFI_PWD='"NessoMesh123"'
build_src_filter = ${Nesso_N1.build_src_filter}
  +<helpers/esp32/*.cpp>
  -<helpers/esp32/ESPNOWRadio.cpp>
  +<../examples/companion_radio/*.cpp>
  +<../examples/companion_radio/ui-new/*.cpp>
lib_deps =
  ${Nesso_N1.lib_deps}
  densaugeo/base64 @ ~1.4.0

[env:Nesso_N1_companion_radio_smart_ota]
extends = env:Nesso_N1_companion_radio_smart
build_flags =
  ${env:Nesso_N1_companion_radio_smart.build_flags}
  -UDISABLE_WIFI_OTA
  -D NESSO_ENABLE_SAFE_OTA=1
lib_deps =
  ${env:Nesso_N1_companion_radio_smart.lib_deps}
  ${esp32_ota.lib_deps}

[env:Nesso_N1_repeater]
extends = Nesso_N1
build_flags =
  ${Nesso_N1.build_flags}
  -D ADVERT_NAME='"Nesso N1 Repeater"'
  -D ADVERT_LAT=0.0
  -D ADVERT_LON=0.0
  -D ADMIN_PASSWORD='"password"'
  -D MAX_NEIGHBOURS=50
build_src_filter = ${Nesso_N1.build_src_filter}
  +<../examples/simple_repeater>
lib_deps =
  ${Nesso_N1.lib_deps}

[env:Nesso_N1_room_server]
extends = Nesso_N1
build_flags =
  ${Nesso_N1.build_flags}
  -D ADVERT_NAME='"Nesso N1 Room"'
  -D ADVERT_LAT=0.0
  -D ADVERT_LON=0.0
  -D ADMIN_PASSWORD='"password"'
  -D ROOM_PASSWORD='"hello"'
build_src_filter = ${Nesso_N1.build_src_filter}
  +<../examples/simple_room_server>
lib_deps =
  ${Nesso_N1.lib_deps}

[env:Nesso_N1_kiss_modem]
extends = Nesso_N1
build_src_filter = ${Nesso_N1.build_src_filter}
  +<../examples/kiss_modem/>
lib_deps =
  ${Nesso_N1.lib_deps}
